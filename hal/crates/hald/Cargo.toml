[package]
name = "hald"
description = "seedypod hardware daemon: owns the Gardyn's pins and buses, publishes over MQTT, serves stills over HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hald"
path = "src/main.rs"

[dependencies]
hal-core.workspace = true
hal-sim.workspace = true
hal-drivers.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml = "0.8"
rumqttc = { version = "0.25", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
default = []
# Real drivers (rppal). Default builds and CI exercise the simulator path.
hardware = ["hal-drivers/hardware"]
