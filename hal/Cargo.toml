[workspace]
resolver = "2"
# podvision is its own binary that core runs per capture (#191); nothing in hald depends on it (ADR 0004, 0019).
members = ["crates/hal-core", "crates/hal-sim", "crates/hal-drivers", "crates/hald", "crates/podvision"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/seedypod/core"
rust-version = "1.80"

[workspace.dependencies]
hal-core = { path = "crates/hal-core" }
hal-sim = { path = "crates/hal-sim" }
hal-drivers = { path = "crates/hal-drivers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# hald stays small; podvision's decode and forward pass are hot loops on a Pi Zero W's one core.
[profile.release.package.podvision]
opt-level = 3

[profile.release.package.jpeg-decoder]
opt-level = 3
