name: Renovate

# Self-hosted Renovate, so dependency PRs don't depend on installing the
# Renovate GitHub App. Rules live in renovate.json. RENOVATE_TOKEN must be a
# fine-grained PAT (seedypod/core: Contents, Pull requests, Issues, Workflows
# read/write) so Renovate's PRs trigger CI; until it is set the job skips.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Check for RENOVATE_TOKEN
        id: token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ] || [ "$RENOVATE_TOKEN" = "PLACEHOLDER-replace-me" ]; then
            echo "::notice::RENOVATE_TOKEN is not set; skipping Renovate."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.token.outputs.present == 'true'
      - uses: renovatebot/github-action@v46.3.11
        if: steps.token.outputs.present == 'true'
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_PLATFORM_COMMIT: 'true'
