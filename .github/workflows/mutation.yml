name: Mutation Testing

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Override glob of files to mutate (blank = use shard default)'
        required: false
        default: ''
  # Weekly full run, Saturday 06:00 UTC
  schedule:
    - cron: '0 6 * * 6'
  # Opt-in per PR via the `mutation-test` label
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    if: >-
      github.event_name != 'pull_request'
      || github.event.label.name == 'mutation-test'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          # Keep in sync with stryker.config.mjs `mutate`.
          - name: server
            mutate: "src/server/**/*.ts,src/mcp/**/*.ts,!src/**/tests/**,!src/**/*.test.ts"
          - name: hardware
            mutate: "src/hardware/**/*.ts,src/lib/**/*.ts,!src/**/tests/**,!src/**/*.test.ts"
          - name: scheduler-grow-alerts
            mutate: "src/scheduler/**/*.ts,src/grow/**/*.ts,src/alerts/**/*.ts,!src/**/tests/**,!src/**/*.test.ts"
    name: mutate (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Restore incremental report
        uses: actions/cache@v5
        with:
          path: reports/mutation/incremental.json
          key: stryker-incremental-${{ matrix.shard.name }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ matrix.shard.name }}-${{ github.ref }}-
            stryker-incremental-${{ matrix.shard.name }}-
      - name: Run Stryker
        env:
          SCOPE: ${{ github.event.inputs.scope || matrix.shard.mutate }}
        run: pnpm stryker run --mutate "$SCOPE" --incremental
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: mutation-report-${{ matrix.shard.name }}
          path: reports/mutation
          retention-days: 30
