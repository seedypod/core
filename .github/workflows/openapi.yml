name: Publish OpenAPI Spec

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Boot core (simulator) and capture the spec
        run: |
          PORT=3000 node server/dist/index.js &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/openapi.json -o openapi.json; then break; fi
            sleep 1
          done
          jq . openapi.json > /dev/null
      - uses: actions/upload-artifact@v6
        with:
          name: openapi${{ github.ref_name == 'dev' && '-dev' || '' }}
          path: openapi.json
          retention-days: 90
