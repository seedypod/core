name: Dev Release

# Rolling pre-built release from `dev`, tagged `dev-latest` (not `dev`, to
# avoid a branch/tag ref collision — see ref-collision-check.yml).

on:
  push:
    branches:
      - dev

concurrency:
  group: dev-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pin commit metadata into .git-info
        run: |
          jq -n \
            --arg branch "${{ github.ref_name }}" \
            --arg hash "${GITHUB_SHA:0:7}" \
            --arg title "$(git log -1 --format=%s)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{branch:$branch, commitHash:$hash, commitTitle:$title, buildDate:$date}' \
            > .git-info

      - name: Set install script default branch
        run: sed -i 's/__BRANCH__/${{ github.ref_name }}/' scripts/install

      - name: Create deploy tarball
        run: |
          tar czf /tmp/seedypod-core.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.env*' \
            --exclude='*.db' \
            --exclude='*.db-*' \
            --exclude='test-results' \
            --exclude='hal/target' \
            --exclude='.claude' \
            .
          mv /tmp/seedypod-core.tar.gz .

      - name: Check the tarball has no Git LFS pointers
        # Without lfs: true on checkout, the brand PNGs ship as pointer text and the logo breaks on the unit.
        run: |
          mkdir -p "$RUNNER_TEMP/tarball" && tar xzf seedypod-core.tar.gz -C "$RUNNER_TEMP/tarball"
          if grep -rlx 'version https://git-lfs.github.com/spec/v1' "$RUNNER_TEMP/tarball"; then
            echo "::error::Git LFS pointer files in seedypod-core.tar.gz; check out with lfs: true"
            exit 1
          fi
          [ "$(file -b --mime-type "$RUNNER_TEMP/tarball/web/dist/brand/icon-64.png")" = image/png ]

      - name: Update dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --yes 2>/dev/null || true
          git push -d --no-verify origin refs/tags/dev-latest 2>/dev/null || true
          git tag -f dev-latest
          git push -f --no-verify origin refs/tags/dev-latest
          gh release create dev-latest seedypod-core.tar.gz \
            --target "${{ github.sha }}" \
            --title "Dev (latest)" \
            --prerelease \
            --notes "Rolling pre-built release from the \`dev\` branch.

          **Commit:** ${{ github.sha }}
          **Title:** $(git log -1 --format=%s)

          Install with \`scripts/install --branch dev\` or point \`lp-update\` at this release."
