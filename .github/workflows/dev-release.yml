name: Dev Release

# Rolling pre-built release from `dev`, tagged `dev-latest` (not `dev`, to
# avoid a branch/tag ref collision — see ref-collision-check.yml).

on:
  push:
    branches:
      - dev

# Concurrency is per job, not per workflow: a new push cancels everything here
# except sqlite-armv6 and os-image, which can run for longer than the gap between pushes.

permissions:
  contents: write

jobs:
  hal:
    name: hald ${{ matrix.target }}
    runs-on: ubuntu-latest
    concurrency:
      group: dev-release-hal-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      matrix:
        target: [arm-unknown-linux-gnueabihf, aarch64-unknown-linux-gnu]
    defaults:
      run:
        working-directory: hal
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hal
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      - run: cross build --release --target ${{ matrix.target }} -p hald --features hardware
      - run: cp target/${{ matrix.target }}/release/hald hald-${{ matrix.target }}
      # The update helper refuses an asset it can't check (ADR-0026).
      - run: sha256sum hald-${{ matrix.target }} > hald-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: hald-${{ matrix.target }}
          path: |
            hal/hald-${{ matrix.target }}
            hal/hald-${{ matrix.target }}.sha256

  sqlite-armv6:
    uses: ./.github/workflows/sqlite-armv6.yml

  release:
    runs-on: ubuntu-latest
    needs: [hal, sqlite-armv6]
    # Without the binary a Pi Zero W compiles it, which beats no release at all.
    if: ${{ !cancelled() && needs.hal.result == 'success' && needs.sqlite-armv6.result != 'cancelled' }}
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pin commit metadata into .git-info
        run: |
          jq -n \
            --arg branch "${{ github.ref_name }}" \
            --arg hash "${GITHUB_SHA:0:7}" \
            --arg title "$(git log -1 --format=%s)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{branch:$branch, commitHash:$hash, commitTitle:$title, buildDate:$date}' \
            > .git-info

      - name: Set install script default branch
        run: sed -i 's/__BRANCH__/${{ github.ref_name }}/' scripts/install

      - name: Create deploy tarball
        run: |
          tar czf /tmp/seedypod-core.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.env*' \
            --exclude='*.db' \
            --exclude='*.db-*' \
            --exclude='test-results' \
            --exclude='hal/target' \
            --exclude='.claude' \
            .
          mv /tmp/seedypod-core.tar.gz .
          sha256sum seedypod-core.tar.gz > seedypod-core.tar.gz.sha256

      - name: Check the tarball has no Git LFS pointers
        # Without lfs: true on checkout, the brand PNGs ship as pointer text and the logo breaks on the unit.
        run: |
          mkdir -p "$RUNNER_TEMP/tarball" && tar xzf seedypod-core.tar.gz -C "$RUNNER_TEMP/tarball"
          if grep -rlx 'version https://git-lfs.github.com/spec/v1' "$RUNNER_TEMP/tarball"; then
            echo "::error::Git LFS pointer files in seedypod-core.tar.gz; check out with lfs: true"
            exit 1
          fi
          [ "$(file -b --mime-type "$RUNNER_TEMP/tarball/web/dist/brand/icon-64.png")" = image/png ]

      - uses: actions/upload-artifact@v6
        with:
          name: seedypod-core
          path: seedypod-core.tar.gz
          retention-days: 1

      - name: Download hald binaries
        uses: actions/download-artifact@v8
        with:
          pattern: hald-*
          merge-multiple: true
          path: release-assets

      - name: Download the ARMv6 better-sqlite3
        uses: actions/download-artifact@v8
        with:
          pattern: better-sqlite3-armv6
          merge-multiple: true
          path: release-assets

      - name: Update dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f dev-latest
          git push -f --no-verify origin refs/tags/dev-latest
          notes="Rolling pre-built release from the \`dev\` branch.

          **Commit:** ${{ github.sha }}
          **Title:** $(git log -1 --format=%s)

          Flash \`seedypod-os.img.xz\`, or install with \`scripts/install-hal --version dev-latest\`, then \`scripts/install --branch dev\`. The image lags a push by as long as it takes to build: \`seedypod-os-manifest.txt\` says which commit it's from."
          if gh release view dev-latest >/dev/null 2>&1; then
            # Everything but the image, which os-image replaces once it's built. Deleting
            # it here would leave a gap on every push, and no image at all on a busy day.
            gh release view dev-latest --json assets --jq '.assets[].name' | grep -v '^seedypod-os' \
              | xargs -r -n1 gh release delete-asset dev-latest --yes
            gh release upload dev-latest seedypod-core.tar.gz seedypod-core.tar.gz.sha256 release-assets/* --clobber
            gh release edit dev-latest --target "${{ github.sha }}" --title "Dev (latest)" --prerelease --notes "$notes"
          else
            gh release create dev-latest seedypod-core.tar.gz seedypod-core.tar.gz.sha256 release-assets/* \
              --target "${{ github.sha }}" --title "Dev (latest)" --prerelease --notes "$notes"
          fi

  os-image:
    needs: [release]
    uses: ./.github/workflows/os-image.yml
    with:
      tag: dev-latest
      branch: dev
